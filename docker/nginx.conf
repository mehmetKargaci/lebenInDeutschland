server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's mime.types has no .webmanifest entry, so it'd 404-install as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Never let a stale cache delay Angular's service-worker update check.
    location ~ ^/(ngsw\.json|ngsw-worker\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:ico|css|gif|jpe?g|png)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=1296000, must-revalidate";
    }

    location ~* \.js$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # Cache-busting strategy
    location /static/ {
        try_files $uri $uri/ =404;
    }
}
